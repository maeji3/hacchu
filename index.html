<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>発注管理</title>
<meta name="apple-mobile-web-app-title" content="発注管理">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#e3f0ee">
<meta name="robots" content="noindex, nofollow">
<style>
  html,body{margin:0;height:100%;background:#eef7f5;color:#1d2321;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  img{width:160px;height:160px;border-radius:36px;box-shadow:0 8px 24px rgba(15,110,102,.18)}
  h1{margin:0;font-size:26px}
  .go{display:inline-block;background:#0f6e66;color:#fff;text-decoration:none;font-weight:700;font-size:20px;padding:16px 40px;border-radius:14px}
  .muted{color:#5f6b67;font-size:15px;line-height:1.7}
  .card{background:#fff;border:1px solid #e2e0d8;border-radius:16px;padding:18px 22px;max-width:440px;text-align:left}
  .card ol{margin:8px 0 0;padding-left:1.4em}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <img src="icon-512.png" alt="">
  <h1>発注管理</h1>
  <div id="setup" class="card hidden">
    <b>ホーム画面に追加してください</b>
    <ol class="muted">
      <li>画面上（または下）の共有ボタン <b>□↑</b> を押す</li>
      <li>「<b>ホーム画面に追加</b>」を押す</li>
      <li>名前が「発注管理」になっているのを確かめて「追加」</li>
    </ol>
    <p class="muted" style="margin-bottom:0">追加したアイコンから開くと、アプリがすぐ開きます。</p>
  </div>
  <a class="go" id="go" href="#">開く</a>
  <div id="msg" class="muted">アプリを開いています…</div>
</div>
<script>
  // 発注管理アプリ（Google Apps Script）の入口。中身はGoogle側にあり、合言葉がないと見られない
  var APP = 'https://script.google.com/macros/s/AKfycbyOgUfipcpPs1zzAVl-McE7goiVEuNC8UKoY-TJ-Zybf-L6vl7H2ihJvy0gJfHVvLwp/exec';
  document.getElementById('go').href = APP;
  if (/add|setup/.test(location.hash + location.search)) {
    // 設定用に開いたとき：自動では移動せず、追加の手順を出す。ホーム画面には余計な記号のないURLで登録されるようにする
    document.getElementById('setup').classList.remove('hidden');
    document.getElementById('msg').classList.add('hidden');
    history.replaceState(null, '', location.pathname);
  } else {
    location.replace(APP);
  }
</script>
</body>
</html>
